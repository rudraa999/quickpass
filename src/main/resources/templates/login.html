<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPass - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-100 selection:text-indigo-700">

    <div class="max-w-md w-full">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-200 mb-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Welcome to QuickPass</h1>
            <p class="text-slate-500 text-sm mt-1.5">Sign in to your account to continue</p>
        </div>

        <!-- Card Container -->
        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200/80 p-8">
            <!-- Alert message container -->
            <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl text-sm font-medium"></div>

            <!-- Logout message if redirected from logout -->
            <div th:if="${param.logout}" class="mb-5 p-3.5 rounded-xl text-sm font-medium bg-blue-50 border border-blue-200 text-blue-700 flex items-center space-x-2">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>You have been logged out successfully.</span>
            </div>

            <form id="loginForm" class="space-y-4">
                <!-- Email Address -->
                <div>
                    <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com"
                           class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 transition shadow-sm">
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 transition shadow-sm">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                        class="w-full mt-3 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold shadow-md shadow-indigo-200 transition duration-150">
                    Sign In
                </button>
            </form>

            <!-- Footer Link -->
            <div class="mt-6 pt-5 border-t border-slate-100 text-center text-sm text-slate-500">
                Don't have an account? 
                <a th:href="@{/register}" class="text-indigo-600 hover:text-indigo-700 font-semibold hover:underline">
                    Create an account
                </a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            alertBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            const payload = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.className = 'mb-5 p-3.5 rounded-xl text-sm font-medium bg-emerald-50 border border-emerald-200 text-emerald-800 flex items-center space-x-2';
                    alertBox.innerHTML = `
                        <svg class="w-4 h-4 shrink-0 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        <span>Login successful! Redirecting to your workspace...</span>
                    `;
                    alertBox.classList.remove('hidden');

                    if (data.token) {
                        localStorage.setItem('quickpass_token', data.token);
                    }

                    // Smart role-based & deep-link redirect
                    let targetUrl = '/dashboard';
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectParam = urlParams.get('redirect');

                    if (redirectParam && redirectParam.startsWith('/') && !redirectParam.startsWith('//')) {
                        targetUrl = redirectParam;
                    } else if (data.role === 'ROLE_ADMIN') {
                        targetUrl = '/admin';
                    } else if (data.role === 'ROLE_STAFF') {
                        targetUrl = '/staff/events';
                    } else if (data.role === 'ROLE_ORGANIZER') {
                        targetUrl = '/organizer';
                    }

                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 500);
                } else {
                    let errMsg = data.error || (data.message ? data.message : 'Invalid email or password');
                    if (!data.error && !data.message && typeof data === 'object') {
                        errMsg = Object.values(data).join(', ');
                    }
                    alertBox.className = 'mb-5 p-3.5 rounded-xl text-sm font-medium bg-rose-50 border border-rose-200 text-rose-800 flex items-center space-x-2';
                    alertBox.innerHTML = `
                        <svg class="w-4 h-4 shrink-0 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span>${errMsg}</span>
                    `;
                    alertBox.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            } catch (err) {
                alertBox.className = 'mb-5 p-3.5 rounded-xl text-sm font-medium bg-rose-50 border border-rose-200 text-rose-800 flex items-center space-x-2';
                alertBox.innerHTML = `
                    <svg class="w-4 h-4 shrink-0 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>Server connection failed. Please try again.</span>
                `;
                alertBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
