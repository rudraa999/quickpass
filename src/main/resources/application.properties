spring.application.name=quickpass

# MySQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JWT Configuration
quickpass.jwt.secret=${JWT_SECRET}
quickpass.jwt.expiration-ms=86400000
quickpass.jwt.cookie-name=quickpass_token

# Main Admin Configuration (injected via launch.json / env vars)
quickpass.admin.email=${ADMIN_EMAIL}
quickpass.admin.password=${ADMIN_PASSWORD}
quickpass.admin.name=${ADMIN_NAME}

logging.level.org.springframework.security=DEBUG
