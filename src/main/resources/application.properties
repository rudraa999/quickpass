spring.application.name=quickpass

# MySQL Database Configuration
spring.datasource.url=${db_URL:jdbc:mysql://localhost:3306/quickpass?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${db_USERNAME:root}
spring.datasource.password=${db_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JWT Configuration
quickpass.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
quickpass.jwt.expiration-ms=86400000
quickpass.jwt.cookie-name=quickpass_token

# Main Admin Configuration (injected via launch.json / env vars)
quickpass.admin.email=${ADMIN_EMAIL:admin@quickpass.com}
quickpass.admin.password=${ADMIN_PASSWORD:admin123}
quickpass.admin.name=${ADMIN_NAME:Main Admin}

# Razorpay Configuration (injected via launch.json / env vars)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}

# Google OAuth 2.0 Configuration (injected via launch.json / env vars)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

logging.level.org.springframework.security=DEBUG
